<html>
<head>

<style>

 body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
    height: auto;
    overflow: hidden;

    margin: 0;
    gap: 20px;
    padding-top: 50px;
    box-sizing: border-box;
    background-image: url("pozadina.png");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;

    font-family: Arial, sans-serif;
}

    /* ============================= */
    /* DESKTOP SKALIRANJE */
    /* ============================= */

    @media (min-width: 901px) {
        body {
            zoom: 0.67;
        }
    }


    /* ============================= */
    /* NOVAC I ULOG */
    /* ============================= */

    #info {
        width: 900px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 15px 25px;
        box-sizing: border-box;

        border-radius: 15px;

        background: rgba(10, 15, 20, 0.9);

        border: 2px solid rgba(255, 255, 255, 0.2);

        color: white;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
    }


    .novac,
    .ulog,
    .besplatne {
        display: flex;
        align-items: center;
        gap: 10px;

        font-size: 20px;
        font-weight: bold;
    }


    #novac,
    #ulog,
    #besplatneIgre {
        min-width: 70px;

        text-align: center;

        font-size: 24px;
    }


    .kontrola {
        width: 45px;
        height: 45px;

        border-radius: 10px;

        border: 1px solid rgba(255, 255, 255, 0.3);

        background: rgba(40, 45, 50, 0.9);

        color: white;

        font-size: 25px;
        font-weight: bold;

        cursor: pointer;
    }


    .kontrola:hover {
        background: rgba(70, 75, 80, 0.9);
    }


    .kontrola:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }


    /* ============================= */
    /* SLOT */
    /* ============================= */

    #ram {
        border: 3px solid black;

        border-radius: 25px;

        width: 1400px;
        height: 600px;

        display: grid;

        grid-template-columns: repeat(5, 1fr);

        grid-template-rows:
            repeat(3, minmax(0, 1fr));

        gap: 4px;

        padding: 10px;

        box-sizing: border-box;

        background: rgba(20, 25, 30, 0.9);

        box-shadow:
            0 10px 30px rgba(0, 0, 0, 0.7);
    }


    .znak {
        border: 1px solid rgba(255, 255, 255, 0.2);

        border-radius: 8px;

        background: rgba(10, 15, 20, 0.85);

        display: flex;

        justify-content: center;
        align-items: center;

        box-shadow:
            inset 0 0 10px rgba(0, 0, 0, 0.8);

        min-height: 0;
        min-width: 0;

        overflow: hidden;
    }


    .znak img {
        width: auto;
        height: auto;

        max-width: 80%;
        max-height: 80%;

        object-fit: contain;
    }


    /* ============================= */
    /* DOBITNI ZNAK */
    /* ============================= */

    .dobitniZnak {
        animation:
            svetliDobitak 0.6s infinite alternate;

        border: 3px solid gold !important;

        box-shadow:
            0 0 10px gold,
            0 0 20px gold,
            inset 0 0 10px gold !important;

        transform: scale(1.05);
    }


    @keyframes svetliDobitak {

        from {
            filter: brightness(1);
        }

        to {
            filter: brightness(1.5);
        }

    }


    /* ============================= */
    /* PORUKE */
    /* ============================= */

    #poruka {
        min-height: 35px;

        color: white;

        font-family: "Arial Black", Arial, sans-serif;

        font-size: 28px;

        font-weight: 900;

        letter-spacing: 1px;

        text-align: center;

        text-transform: uppercase;

        text-shadow:
            0 0 5px rgba(255, 255, 255, 0.4),
            0 0 12px rgba(255, 255, 255, 0.25);
    }


    #poslednjiDobitak {
        min-height: 45px;

        color: white;

        font-family: "Arial Black", Arial, sans-serif;

        font-size: 32px;

        font-weight: 900;

        letter-spacing: 1px;

        text-align: center;

        margin-top: 5px;

        text-shadow:
            0 0 5px rgba(255, 255, 255, 0.4),
            0 0 12px rgba(255, 255, 255, 0.25);
    }


    /* ============================= */
    /* BESPLATNE IGRE */
    /* ============================= */

    #besplatneIgreBox {
        display: none;
    }


    /* ============================= */
    /* SPIN DUGME */
    /* ============================= */

    #dug {
        position: relative;

        z-index: 10;

        flex-shrink: 0;
    }


    #spin {
        width: 300px;
        height: 180px;

        border-radius: 20px;

        background-image: url("lo.png");

        background-size: contain;

        background-position: center;

        background-repeat: no-repeat;

        background-color:
            rgba(10, 15, 20, 0.9);

        border:
            1px solid rgba(255, 255, 255, 0.2);

        box-shadow:
            0 0 15px rgba(0, 0, 0, 0.7);

        cursor: pointer;
    }


    #spin:hover {
        transform: scale(1.02);
    }


    /* ========================================
       SAFETY CAR ANIMACIJA
       ======================================== */

    #scOverlay {
        position: fixed;
        inset: 0;

        display: none;

        justify-content: center;
        align-items: center;

        background: rgba(0, 0, 0, 0.75);

        z-index: 1000;

        animation: scZatamnjenje 0.3s ease;
    }


    #scPoruka {
        text-align: center;

        color: white;

        font-size: 70px;

        font-weight: bold;

        text-shadow:
            0 0 10px white,
            0 0 25px white,
            0 0 50px white;

        animation:
            scPoruka 0.6s ease-in-out infinite alternate;
    }


    #scPoruka span {
        display: block;

        margin-top: 15px;

        font-size: 40px;
    }


    @keyframes scZatamnjenje {

        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }

    }


    @keyframes scPoruka {

        from {
            transform: scale(1);
        }

        to {
            transform: scale(1.08);
        }

    }


    /* ========================================
       RESPONSIVE DIZAJN
       ======================================== */

    /* Laptop / manji desktop */

    @media (max-width: 1450px) and (min-width: 901px) {

        #ram {
            width: 95vw;
            height: 55vh;
        }

        #info {
            width: 95vw;
        }

    }


    /* Tablet */

    @media (max-width: 900px) {

        body {
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }


        #info {
            width: 95vw;
            padding: 10px 15px;
            gap: 10px;
        }


        .novac,
        .ulog,
        .besplatne {
            font-size: 15px;
            gap: 5px;
        }


        #novac,
        #ulog,
        #besplatneIgre {
            min-width: 50px;
            font-size: 18px;
        }


        .kontrola {
            width: 38px;
            height: 38px;
            font-size: 20px;
        }


        #ram {
            width: 95vw;
            height: 55vw;
            max-height: 500px;
        }


        #poslednjiDobitak {
            font-size: 20px;
        }


        #spin {
            width: 220px;
            height: 130px;
        }

    }


    /* Telefon */

    @media (max-width: 600px) {

        body {
            gap: 8px;
            padding: 5px;
        }


        #info {
            width: 98vw;
            padding: 8px;
            border-radius: 10px;
        }


        .novac,
        .ulog,
        .besplatne {
            font-size: 12px;
            gap: 3px;
        }


        #novac,
        #ulog,
        #besplatneIgre {
            min-width: 35px;
            font-size: 15px;
        }


        .kontrola {
            width: 32px;
            height: 32px;
            font-size: 18px;
            border-radius: 7px;
        }


        #ram {
            width: 98vw;
            height: 58vw;
            padding: 5px;
            gap: 2px;
            border-radius: 15px;
        }


        .znak {
            border-radius: 5px;
        }


        .znak img {
            max-width: 75%;
            max-height: 75%;
        }


        #poruka {
            font-size: 16px;
        }


        #poslednjiDobitak {
            font-size: 18px;
        }


        #spin {
            width: 180px;
            height: 105px;
            border-radius: 15px;
        }

    }


    /* ========================================
       PAYTABLE DUGME
       ======================================== */

    #paytableDugme {

        position: fixed;

        top: 20px;
        right: 20px;

        width: 45px;
        height: 45px;

        border-radius: 50%;

        border: 2px solid rgba(255, 255, 255, 0.4);

        background: rgba(10, 15, 20, 0.9);

        color: white;

        font-size: 25px;
        font-weight: bold;

        cursor: pointer;

        z-index: 100;

        box-shadow:
            0 0 10px rgba(0, 0, 0, 0.6);
    }


    #paytableDugme:hover {

        background: rgba(50, 55, 60, 0.95);

        transform: scale(1.05);
    }


    /* ========================================
       PAYTABLE PROZOR
       ======================================== */

    #paytableProzor {

        position: fixed;

        inset: 0;

        display: none;

        justify-content: center;
        align-items: center;

        background: rgba(0, 0, 0, 0.75);

        z-index: 2000;
    }


    /* ========================================
       SADRŽAJ PAYTABLE-A
       ======================================== */

    #paytableSadrzaj {

        position: relative;

        width: 650px;
        max-width: 90vw;

        max-height: 85vh;

        overflow-y: auto;

        padding: 30px;

        box-sizing: border-box;

        border-radius: 20px;

        background: rgba(15, 20, 25, 0.98);

        border: 2px solid rgba(255, 255, 255, 0.25);

        color: white;

        box-shadow:
            0 10px 40px rgba(0, 0, 0, 0.8);
    }


    #paytableSadrzaj h2 {

        margin-top: 0;
        margin-bottom: 25px;

        text-align: center;

        font-size: 30px;
    }


    /* ========================================
       ZATVARANJE
       ======================================== */

    #paytableZatvori {

        position: absolute;

        top: 10px;
        right: 15px;

        border: none;

        background: transparent;

        color: white;

        font-size: 30px;

        cursor: pointer;
    }


    #paytableZatvori:hover {

        transform: scale(1.1);
    }


    /* ========================================
       RED SIMBOLA
       ======================================== */

    .paytableRed {

        display: grid;

        grid-template-columns:
            90px 1fr 1fr 1fr;

        align-items: center;

        gap: 10px;

        padding: 10px 5px;

        border-bottom:
            1px solid rgba(255, 255, 255, 0.1);
    }


    .paytableRed img {

        width: 55px;
        height: 55px;

        object-fit: contain;
    }


    .paytableVrednost {

        text-align: center;

        font-size: 18px;

        font-weight: bold;
    }


    .paytableNaslov {

        font-size: 14px;

        color: rgba(255, 255, 255, 0.6);

        text-align: center;
    }


    /* ========================================
       SC
       ======================================== */

    .paytableWild {

        display: flex;

        justify-content: center;
        align-items: center;

        gap: 15px;

        margin-top: 20px;

        padding: 15px;

        border-radius: 10px;

        background: rgba(255, 255, 255, 0.05);

        font-size: 20px;
    }


    .paytableFree {

        margin-top: 15px;

        text-align: center;

        font-size: 18px;

        font-weight: bold;
    }


    /* ========================================
       PAYTABLE - TELEFON
       ======================================== */

    @media (max-width: 600px) {

        #paytableDugme {

            top: 10px;
            right: 10px;

            width: 38px;
            height: 38px;

            font-size: 21px;
        }


        #paytableSadrzaj {

            padding: 25px 15px;

            width: 95vw;
        }


        .paytableRed {

            grid-template-columns:
                60px 1fr 1fr 1fr;

            gap: 5px;
        }


        .paytableRed img {

            width: 45px;
            height: 45px;
        }


        .paytableVrednost {

            font-size: 14px;
        }

    }

</style>

</head>


<body>


    <!-- ============================= -->
    <!-- NOVAC I ULOG -->
    <!-- ============================= -->

    <div id="info">


        <div class="novac">

            <span>Novac:</span>

            <span id="novac">500</span>

            <span>€</span>

        </div>


        <button id="paytableDugme">?</button>


        <div id="paytableProzor">

            <div id="paytableSadrzaj">

                <button id="paytableZatvori">×</button>

                <h2>ISPLATE</h2>

                <div id="paytableTabela"></div>

                <div class="paytableWild">
                    <strong>SC</strong>
                    <span>WILD</span>
                </div>

                <div class="paytableFree">
                    3+ SC → +10 FREE GAMES
                </div>

            </div>

        </div>


        <div class="ulog">

            <button
                class="kontrola"
                id="minus">
                -
            </button>


            <span>Ulog:</span>


            <span id="ulog">10</span>


            <span>€</span>


            <button
                class="kontrola"
                id="plus">
                +
            </button>

        </div>


        <!-- OVO SE POJAVLJUJE SAMO KADA IMA FREE GAMES -->

        <div
            class="besplatne"
            id="besplatneIgreBox">

            <span>Besplatne igre:</span>

            <span id="besplatneIgre">0</span>

        </div>


    </div>


    <!-- ============================= -->
    <!-- SLOT -->
    <!-- ============================= -->

    <div id="ram">


        <!-- RED 1 -->

        <div class="znak"></div>
        <div class="znak"></div>
        <div class="znak"></div>
        <div class="znak"></div>
        <div class="znak"></div>


        <!-- RED 2 -->

        <div class="znak"></div>
        <div class="znak"></div>
        <div class="znak"></div>
        <div class="znak"></div>
        <div class="znak"></div>


        <!-- RED 3 -->

        <div class="znak"></div>
        <div class="znak"></div>
        <div class="znak"></div>
        <div class="znak"></div>
        <div class="znak"></div>


    </div>


    <!-- ============================= -->
    <!-- PORUKA -->
    <!-- ============================= -->

    <div id="poruka"></div>


    <div id="poslednjiDobitak">
        Poslednji dobitak: 0 €
    </div>


    <!-- ============================= -->
    <!-- SPIN -->
    <!-- ============================= -->

    <div id="dug">

        <button id="spin"></button>

    </div>


    <!-- SAFETY CAR -->

    <div id="scOverlay">

        <div id="scPoruka">

            <div>SAFETY CAR!</div>

            <span>+10 FREE GAMES</span>

        </div>

    </div>


    <script src="f1igra.js"></script>

</body>

</html>
